name: Signed Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest
    environment: production

    env:
      ESIGNER_INSTALL_DIR: C:\Users\runneradmin\eSignerCKA
      ESIGNER_MASTER_KEY: C:\Users\runneradmin\eSignerCKA\master.key

    steps:
      - uses: actions/checkout@v6
        with:
          # Surum notlari onceki etiketten bu yana gelen commit'lerden uretilir.
          # Varsayilan sigh klonda (fetch-depth: 1) o gecmis yoktur ve notlar
          # sessizce bos kalir; v1.0.20'de tam bu oldu.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Create public build environment
        shell: pwsh
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_PUBLISHABLE_KEY) {
            throw 'Supabase public build secrets are missing.'
          }
          "NEXT_PUBLIC_SUPABASE_URL=$env:SUPABASE_URL" | Set-Content .env.local
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" | Add-Content .env.local

      - name: Configure hosted web URL
        shell: pwsh
        env:
          EKAP_WEB_URL: ${{ vars.EKAP_WEB_URL }}
        run: |
          $config = @{ webUrl = if ($env:EKAP_WEB_URL) { $env:EKAP_WEB_URL } else { '' } }
          $config | ConvertTo-Json | Set-Content desktop/app-config.json

      - name: Select signing provider
        id: signing
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          PFX_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SELF_SIGNED_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PUBLIC_BASE64 }}
        run: |
          if ($env:ESIGNER_USERNAME) {
            'method=esigner' >> $env:GITHUB_OUTPUT
          } elseif ($env:PFX_CERTIFICATE -and $env:SELF_SIGNED_CERTIFICATE) {
            'method=selfsigned' >> $env:GITHUB_OUTPUT
          } elseif ($env:PFX_CERTIFICATE) {
            'method=pfx' >> $env:GITHUB_OUTPUT
          } else {
            throw 'No Windows code-signing provider is configured. Unsigned releases are blocked.'
          }

      - name: Validate self-signed public certificate
        if: steps.signing.outputs.method == 'selfsigned'
        shell: pwsh
        env:
          PUBLIC_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PUBLIC_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'EKAP-Editor-Code-Signing.cer'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:PUBLIC_CERTIFICATE))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
          if ($certificate.Subject -ne 'CN=EKAP Editor') {
            throw "Unexpected self-signed certificate subject: $($certificate.Subject)"
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $hasCodeSigningEku = $certificate.Extensions |
            Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object Value -eq $codeSigningOid
          if (-not $hasCodeSigningEku) {
            throw 'The self-signed certificate is not valid for code signing.'
          }
          "SELF_SIGNED_CERT_PATH=$certificatePath" >> $env:GITHUB_ENV
          "SELF_SIGNED_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Install SSL.com eSigner CKA
        if: steps.signing.outputs.method == 'esigner'
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip 'https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.8/SSL.COM-eSigner-CKA_1.0.8.zip'
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination eSigner_CKA_Installer.exe -Path 'eSigner_CKA_*\*.exe'
          New-Item -ItemType Directory -Force -Path $env:ESIGNER_INSTALL_DIR | Out-Null
          Start-Process .\eSigner_CKA_Installer.exe -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$env:ESIGNER_INSTALL_DIR`"" -Wait
          Start-Process .\setup\vc_redist.x86.exe -ArgumentList '/install /q' -Wait
          Start-Process .\setup\vc_redist.x64.exe -ArgumentList '/install /q' -Wait
          & "$env:ESIGNER_INSTALL_DIR\RegisterKSP.exe" | Out-Null
          & "$env:ESIGNER_INSTALL_DIR\eSignerCSP.Config.exe" | Out-Null

      - name: Load SSL.com signing certificate
        if: steps.signing.outputs.method == 'esigner'
        shell: pwsh
        env:
          ESIGNER_MODE: ${{ secrets.ESIGNER_MODE }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          if (-not $env:ESIGNER_MODE -or -not $env:ESIGNER_PASSWORD -or -not $env:ESIGNER_TOTP_SECRET) {
            throw 'SSL.com eSigner secrets are incomplete.'
          }
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" config -mode $env:ESIGNER_MODE -user $env:ESIGNER_USERNAME -pass $env:ESIGNER_PASSWORD -totp $env:ESIGNER_TOTP_SECRET -key $env:ESIGNER_MASTER_KEY -r
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" unload
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" load
          $certificate = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Where-Object Subject -Match 'Esigner' | Select-Object -First 1
          if (-not $certificate) { throw 'SSL.com eSigner certificate was not loaded.' }

      - name: Publish signed release with SSL.com eSigner
        if: steps.signing.outputs.method == 'esigner'
        run: npm run release:esigner
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Publish signed release with PFX certificate
        if: steps.signing.outputs.method == 'pfx' || steps.signing.outputs.method == 'selfsigned'
        run: npm run release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          SIGNING_METHOD: ${{ steps.signing.outputs.method }}
        run: |
          $installer = Get-ChildItem desktop/release -Filter '*.exe' | Where-Object Name -NotMatch '__uninstaller' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:SIGNING_METHOD -eq 'selfsigned') {
            if (-not $signature.SignerCertificate) {
              throw 'Installer does not contain an Authenticode signer certificate.'
            }
            if ($signature.SignatureType -ne 'Authenticode') {
              throw "Unexpected installer signature type: $($signature.SignatureType)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:SELF_SIGNED_CERT_THUMBPRINT) {
              throw "Installer was signed by an unexpected certificate: $($signature.SignerCertificate.Thumbprint)"
            }
            if ($signature.Status -in @('NotSigned', 'HashMismatch', 'NotSupported')) {
              throw "Installer signature failed cryptographic validation: $($signature.Status)"
            }
          } elseif ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }

      - name: Publish self-signed trust package
        if: steps.signing.outputs.method == 'selfsigned'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $certificateAsset = 'desktop/release/EKAP-Editor-Code-Signing.cer'
          Copy-Item -LiteralPath $env:SELF_SIGNED_CERT_PATH -Destination $certificateAsset
          $certificateHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $certificateAsset).Hash
          $installer = Get-ChildItem desktop/release -Filter '*.exe' | Where-Object Name -NotMatch '__uninstaller' | Select-Object -First 1
          $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          @(
            "Sertifika parmak izi (SHA1): $env:SELF_SIGNED_CERT_THUMBPRINT"
            "Sertifika SHA256: $certificateHash"
            "$($installer.Name) SHA256: $installerHash"
          ) | Set-Content desktop/release/EKAP-Editor-SHA256.txt
          gh release upload "v$version" `
            $certificateAsset `
            desktop/scripts/Install-EKAPEditorCertificate.ps1 `
            desktop/scripts/Uninstall-EKAPEditorCertificate.ps1 `
            desktop/release/EKAP-Editor-SHA256.txt `
            --repo erenkarakoc/icmal-releases `
            --clobber

      - name: Publish release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # electron-updater surum notunu GitHub release BODY'sinden okur. Body
          # bos kalirsa kullanici "neyin degistigini" hic goremez.
          #
          # Notlar commit'lerden uretilir: yalniz feat: ve fix: alinir, cunku
          # chore/docs/refactor kullaniciya bir sey ifade etmez. Bicim Markdown
          # baslik + liste; arayuz bunu ayristirip kategorileri stillendirir.
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"

          git fetch --tags --quiet 2>$null
          $onceki = git tag --list 'v*' --sort=-v:refname |
                    Where-Object { $_ -ne $tag } | Select-Object -First 1
          $aralik = if ($onceki) { "$onceki..HEAD" } else { 'HEAD' }
          $satirlar = git log $aralik --no-merges --pretty=format:'%s'
          # git basarisiz olursa asagidaki yedek metne DUSULMEMELI: bos aralik
          # ile okunamayan gecmis ayni sonucu verir ve hata gorunmez kalir.
          if ($LASTEXITCODE -ne 0) { throw "git log $aralik basarisiz; surum notu uretilemedi." }

          # Hattin kendi bakimini kullaniciya anlatmanin anlami yok. release/ci/
          # build kapsamlari notlarin disinda kalir; v1.0.20'de "surum notlari
          # icin tam git gecmisi cekilsin" maddesi bu yuzden elle silinmisti.
          $hatKapsamlari = 'release', 'ci', 'build', 'deps'

          $yeni = @(); $duzeltme = @()
          foreach ($satir in $satirlar) {
            # "feat(kapsam): metin" -> kapsam + metin
            if ($satir -notmatch '^(feat|fix)(\(([^)]*)\))?!?:\s*(.+)$') { continue }
            $tur = $Matches[1]; $kapsam = $Matches[3]; $metin = $Matches[4]
            if ($kapsam -and ($hatKapsamlari -contains $kapsam.ToLower())) { continue }
            if ($tur -eq 'feat') { $yeni += $metin } else { $duzeltme += $metin }
          }

          $govde = @()
          if ($yeni.Count)      { $govde += '## Yenilikler';  $govde += ($yeni      | ForEach-Object { "- $_" }); $govde += '' }
          if ($duzeltme.Count)  { $govde += '## Düzeltmeler'; $govde += ($duzeltme  | ForEach-Object { "- $_" }); $govde += '' }
          if (-not $govde.Count) { $govde = @('## Bu sürüm', '- Bakım ve iyileştirmeler.') }

          $dosya = Join-Path $env:RUNNER_TEMP 'surum-notu.md'
          ($govde -join "`n") | Set-Content -LiteralPath $dosya -Encoding utf8
          Get-Content -LiteralPath $dosya

          gh release edit $tag --notes-file $dosya --repo erenkarakoc/icmal-releases
