appId: com.icmal.app
productName: İcmal
copyright: Copyright © 2026 İcmal

directories:
  output: release

files:
  - dist/**/*

afterPack: ./scripts/after-pack.cjs

extraResources:
  - from: app-config.json
    to: app-config.json
  - from: nextjs-standalone
    to: nextjs-standalone
    filter:
      - '**/*'

fileAssociations:
  - ext: icmal
    name: İcmal projesi
    description: İcmal proje dosyası
    icon: ../public/assets/images/brand/file-icon.ico
    role: Editor
  - ext: ekap
    name: EKAP teklif dosyası
    description: EKAP teklif dosyası
    icon: ../public/assets/images/brand/file-icon.ico
    role: Editor

publish:
  provider: github
  owner: erenkarakoc
  repo: icmal-releases
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../public/assets/images/brand/favicon.ico
  verifyUpdateCodeSignature: true

nsis:
  # Stable legacy GUID preserves Windows uninstall/upgrade identity across the rename.
  guid: 0421d3ae-87d3-5689-b3f5-b57db57f2a90
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
